name: "DroneVisualizer"
version: "0.9.1"
slug: "dronevisualizer"
description: "Ukrainian air-threat Telegram channels on a live map + HA sensors"
url: "https://github.com/privateee/ha_AirAlertVisualizer"
arch:
  - aarch64
  - amd64
init: false
hassio_api: true
services:
  - mqtt:want
ingress: true
panel_icon: mdi:quadcopter
options:
  channels:
    - war_monitor
    - AerisRimor
    - kpszsu
    - vanek_nikolaev
  poll_interval_seconds: 60
  backfill_pages: 3
  area_label: "Kyiv + oblast"
  area_center_lat: 50.4501
  area_center_lon: 30.5234
  area_radius_km: 130
  map_theme: dark
  tile_url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
  tile_url_dark: ""
  alarm_threats:
    - ballistic
  alarm_min_confidence: 0.5
  mqtt: auto
  retain_days: 14
  log_level: info
  log_format: text
schema:
  channels:
    - str
  poll_interval_seconds: int(20,3600)
  backfill_pages: int(1,20)
  area_label: str
  area_center_lat: float
  area_center_lon: float
  area_radius_km: float
  map_theme: list(dark|light)
  tile_url: str
  tile_url_dark: str?
  alarm_threats:
    - str
  alarm_min_confidence: float
  mqtt: list(auto|true|false)
  retain_days: int(1,365)
  log_level: list(debug|info|warning|error)
  log_format: list(text|json)
