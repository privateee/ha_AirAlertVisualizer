blueprint:
  name: DroneVisualizer air alarm
  description: >-
    Notify your phone (and optionally speak) when `binary_sensor.dronevis_alarm`
    turns on, repeating while it stays on; the notification is cleared when the
    alarm ends. The alarm covers the threat types set in the add-on's
    `alarm_threats` option (default: ballistic). For a notification per track,
    with the channel's post, use "DroneVisualizer critical notification".
  domain: automation
  author: DroneVisualizer
  source_url: https://github.com/privateee/ha_AirAlertVisualizer/blob/main/blueprints/automation/dronevis_alert.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    alarm_entity:
      name: Alarm sensor
      default: binary_sensor.dronevis_alarm
      selector:
        entity:
          filter:
            - domain: binary_sensor
    mobile_device:
      name: Phone
      selector:
        device:
          filter:
            - integration: mobile_app
    critical:
      name: Critical (breaks through silent mode / Do Not Disturb)
      default: true
      selector:
        boolean:
    tts_entity:
      name: Text-to-speech engine (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: tts
    media_player:
      name: Speak on (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: media_player
    repeat_minutes:
      name: Repeat every (minutes) while active
      default: 3
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: min

mode: restart
max_exceeded: silent

variables:
  alarm_entity: !input alarm_entity
  critical: !input critical
  tts_entity: !input tts_entity
  media_player: !input media_player

triggers:
  - trigger: state
    entity_id: !input alarm_entity
    to: "on"
    id: "on"
  - trigger: state
    entity_id: !input alarm_entity
    from: "on"
    id: "off"

actions:
  - if:
      - condition: trigger
        id: "off"
    then:
      # the alarm ended: take the notification off the phone
      - device_id: !input mobile_device
        domain: mobile_app
        type: notify
        message: clear_notification
        data:
          tag: dronevis_alarm
      - stop: alarm ended
  - repeat:
      while:
        - condition: state
          entity_id: !input alarm_entity
          state: "on"
      sequence:
        - variables:
            msg: "{{ state_attr(alarm_entity, 'message') or 'Air alarm' }}"
        - device_id: !input mobile_device
          domain: mobile_app
          type: notify
          title: "🚨 Air alarm"
          message: "{{ msg }}"
          data:
            tag: dronevis_alarm
            push:
              interruption-level: "{{ 'critical' if critical else 'time-sensitive' }}"
            ttl: 0
            priority: high
            channel: "{{ 'alarm_stream' if critical else 'DroneVisualizer' }}"
        - if:
            - condition: template
              value_template: "{{ tts_entity | length > 0 and media_player | length > 0 }}"
          then:
            - action: tts.speak
              target:
                entity_id: !input tts_entity
              data:
                cache: false
                media_player_entity_id: !input media_player
                message: "{{ msg }}"
        - delay:
            minutes: !input repeat_minutes
